context:
  version: "4.0.0"
  python_min: "3.10"
  python_max: "3.14.6"

package:
  name: tsam
  version: ${{ version }}

source:
  url: https://github.com/FZJ-IEK3-VSA/tsam/archive/v${{ version }}.tar.gz
  sha256: 8e003af649f750e84aa4c3975d924808b38f631364a35d3fc27c100b44a6e61c

build:
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }},<=${{ python_max }}
    - scikit-learn >=1.3.0,<=1.9.0
    - pandas >=2.2.0,<=3.0.3
    - numpy >=1.22.4,<=2.4.6
    - pyomo >=6.4.3,<=6.10.1
    - tqdm >=4.21.0,<=4.69.1
    - highspy >=1.7.2,<=1.15.1
    - plotly >=5.0.0,<=6.9.0
    - notebook >=7.5.0,<=7.6.1
    
tests:
  - script:
      - pytest -n auto -vvv
    requirements:
      run:
        - pytest <=9.0.3
        - pytest-xdist <=3.8.0
        - python ${{ python_min }}.*
    files:
      source:
        - test/
        - docs/notebooks/
        - pyproject.toml
about:
  homepage: https://github.com/FZJ-IEK3-VSA/tsam
  summary: Time series aggregation module (tsam) to create typical periods
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - julian-belina
