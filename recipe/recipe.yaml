context:
  version: "4.1.0"
  python_min: "3.10"
  python_max: "3.14.7"

package:
  name: tsam
  version: ${{ version }}

source:
  url: https://github.com/FZJ-IEK3-VSA/tsam/archive/v${{ version }}.tar.gz
  sha256: a502fe9340eeb11dfafbf08080088782e75a0980d336d1f02811d5225daa2a45

build:
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }},<=${{ python_max }}
    - scikit-learn >=1.3.0,<=1.9.0
    - scipy >=1.9.0,<=1.18.0
    - pandas >=2.2.0,<=3.0.5
    - numpy >=1.22.4,<=2.4.6
    - pyomo >=6.4.3,<=6.10.1
    - tqdm >=4.21.0,<=4.70.0
    - highspy >=1.7.2,<=1.15.1
    - plotly >=5.0.0,<=6.9.0
    - notebook >=7.5.0,<=7.6.2

tests:
  - script:
      - pytest -n auto -vvv
    requirements:
      run:
        - pytest <=9.1.1
        - pytest-xdist <=3.8.0
        - python ${{ python_min }}.*
    files:
      source:
        - test/
        - docs/data/
        - pyproject.toml

about:
  homepage: https://github.com/FZJ-IEK3-VSA/tsam
  summary: Time series aggregation module (tsam) to create typical periods
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - julian-belina
    - noah80
